[project]
name = "forge-backend"
version = "0.1.0"
description = "Forge — AI-powered software intelligence platform (backend service)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    "neo4j>=5.25,<6.0",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-language-pack>=0.2,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "gitpython>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "anyio>=4.4,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Defense-in-depth: `testpaths` already scopes default collection to `tests/`
# alone, but `data/` (application-generated repository workspaces — see
# core/config.py's `workspace_root_dir`, default "./data/workspaces") can
# itself contain an imported copy of an arbitrary repository, including
# Forge's own (self-referential import for testing). If that copy happens to
# contain a `tests/` package and pytest is ever pointed at a broader path
# than `testpaths` (e.g. explicit `pytest .` from within backend/), it must
# never be collected alongside Forge's own suite — a duplicate `tests.*`
# module path against a different filesystem root raises
# `ImportPathMismatchError`. `norecursedirs` guards this regardless of how
# pytest is invoked.
norecursedirs = ["data", ".git", ".venv", "node_modules"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` in argument defaults is the framework's documented
# dependency-injection pattern, not the mutable-default-argument bug B008 guards
# against — this call is idempotent and side-effect-free. `File`/`Form` are the
# same pattern for multipart request parameters (api/repositories.py's ZIP upload).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
